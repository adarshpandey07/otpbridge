name: otpbridge
description: "OTPBridge — intelligent, rule-based, secure OTP forwarding."
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2

  # Security
  local_auth: ^2.3.0
  crypto: ^3.0.6

  # Contacts (native picker + auto-fill)
  flutter_contacts: ^1.1.9+2

  # Payments
  razorpay_flutter: ^1.4.0

  # Platform / system
  permission_handler: ^11.4.0
  flutter_local_notifications: ^18.0.1

  # Networking (remote sync abstraction; backend-swappable)
  dio: ^5.7.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.0
  equatable: ^2.0.7
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
